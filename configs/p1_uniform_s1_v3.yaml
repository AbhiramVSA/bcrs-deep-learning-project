# Recipe v3 = recipe v2 with the fp32 box decoder (2026-10-05). v2 decoded boxes
# in bf16 under autocast, in the GIoU loss and at evaluation; see
# src/bcrs/models/detector.py::Float32BoxCoder. Everything else is unchanged.
# Uniform baseline at native resolution (also the BCRS fine-detector init).
run_name: p1_uniform_s1_v3
arch: fcos_r18
frozen_bn: true
scale_jitter: [0.7, 1.4]
ema: true
downsample: 1.0
epochs: 30
batch_size: 4
lr: 5.0e-5
warmup_iters: 500
amp: bf16
num_workers: 16
channels_last: true
eval_every_epochs: 5
