# P2c joint BCRS training from the recipe-v2 native-resolution detector
# (frozen BN, jitter-trained -> already scale-robust) and the v2 scorer.
run_name: p2c_bcrs_joint_v2
detector_ckpt: runs/p1_uniform_s1_v2/best.pth
scorer_ckpt: runs/p2b_scorer_s4v2/scorer_best.pth
s: 4.0
tile: 512
overlap: 64
k_min: 1
k_max: 8
budget_norm_k: 20
lambda_sel: 0.5
refine_targets: true
epochs: 12
batch_size: 4
lr: 5.0e-5
scorer_lr: 5.0e-4
amp: bf16
num_workers: 16
eval_every_epochs: 2
eval_k: 3
