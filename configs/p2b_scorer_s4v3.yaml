# Recipe v3 = recipe v2 with the fp32 box decoder (2026-10-05). v2 decoded boxes
# in bf16 under autocast, in the GIoU loss and at evaluation; see
# src/bcrs/models/detector.py::Float32BoxCoder. Everything else is unchanged.
# Tile scorer on the frozen v3 quarter-resolution detector.
run_name: p2b_scorer_s4v3
detector_ckpt: runs/p1_uniform_s4_v3/best.pth
s: 4.0
tile: 512
overlap: 64
epochs: 10
batch_size: 8
lr: 1.0e-3
amp: bf16
num_workers: 16
eval_every_epochs: 1
